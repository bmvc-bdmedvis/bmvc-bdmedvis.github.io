<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 844" role="img" aria-labelledby="title desc">
  <title id="title">Flat biomarker markers across medical vision modalities</title>
  <desc id="desc">A compact flat illustration of biomarker marker regions across pathology, CT, MRI, ultrasound, endoscopy, and biomarker signal views.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#dfecea" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#123236" flood-opacity="0.055"/>
    </filter>
    <linearGradient id="ctBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1d2b31"/>
      <stop offset="1" stop-color="#52646b"/>
    </linearGradient>
    <linearGradient id="usBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#20333b"/>
      <stop offset="1" stop-color="#101e24"/>
    </linearGradient>
    <style>
      .card{fill:#fff;stroke:#d5e1df;stroke-width:2;rx:18;filter:url(#softShadow)}
      .panel{stroke-width:2}
      .teal{stroke:#0b7780}
      .coral{stroke:#d86d61}
      .muted{stroke:#cad7d5}
      .bioRing{fill:none;stroke:#0b7780;stroke-width:6;stroke-dasharray:13 8;stroke-linecap:round}
      .bioDot{fill:#0b7780}
      .bioHalo{fill:#7fd4d0;opacity:.30}
      .bioSignal{fill:none;stroke:#d86d61;stroke-width:6;stroke-linecap:round}
    </style>
  </defs>

